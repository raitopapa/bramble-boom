  .stage:fullscreen{background:#0c1426;}

// ===== src/core/utils.js =====
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const rand = (a,b)=> a+Math.random()*(b-a);
function mulberry32(seed){ return function(){ let t=seed+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }



// ===== src/engine/canvas.js =====
const stage=document.getElementById('stage');
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){
  const dpr=Math.min(2,(typeof window!=='undefined'&&window.devicePixelRatio)||1);
  const w=canvas.clientWidth||(stage&&stage.clientWidth)||960;
  const h=canvas.clientHeight||(stage&&stage.clientHeight)||540;
  let W=Math.max(2,Math.floor(w*dpr)), H=Math.max(2,Math.floor(h*dpr));
  // Cap the backing-store resolution so giant / high-DPI displays don't blow up
  // the per-frame fill cost. Aspect ratio is preserved (CSS stretches to fit).
  const MAXW=2560, MAXH=1440;
  if(W>MAXW||H>MAXH){ const k=Math.min(MAXW/W,MAXH/H); W=Math.max(2,Math.floor(W*k)); H=Math.max(2,Math.floor(H*k)); }
  if(canvas.width!==W||canvas.height!==H){ canvas.width=W; canvas.height=H; }
}
// Shared view metrics (backing px, CSS px, effective scale, orientation).
// Used by the board layout so it can keep clear of the on-screen touch controls.
function viewInfo(){
  const cssW=canvas.clientWidth||(stage&&stage.clientWidth)||960;
  const cssH=canvas.clientHeight||(stage&&stage.clientHeight)||540;
  const W=canvas.width||2, H=canvas.height||2;
  const dpr=cssW>0?W/cssW:1;
  return { W, H, cssW, cssH, dpr, portrait: cssH>cssW*1.02 };
}
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function ellipse(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); ctx.fill(); }


// ===== src/engine/audio.js =====
// ============ AUDIO ============
let AC=null, master=null, sfxGain=null, musicGain=null, audioReady=false, muted=false, musicOn=true;
let musicTimer=null, seqArr=[], loopBeats=8, schedIdx=0, loopStartTime=0, SPB=60/138, curTrack='map';
const TRACKS = {
  overworld:{ bpm:138, chords:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]] },
  cave:{ bpm:104, chords:[[57,60,64],[55,58,62],[53,56,60],[52,55,59]] },
  water:{ bpm:112, chords:[[60,63,67],[58,62,65],[55,60,63],[57,60,64]] },
  sky:{ bpm:152, chords:[[62,66,69],[60,64,67],[64,67,71],[59,62,67]] },
  castle:{ bpm:120, chords:[[55,58,62],[54,57,61],[53,56,60],[52,55,59]] },
  magma:{ bpm:146, chords:[[53,56,60],[55,58,62],[51,55,58],[56,59,63]] },
  boss:{ bpm:150, style:'boss', chords:[[57,60,64],[56,59,63],[55,58,62],[57,60,64]] },
  map:{ bpm:126, chords:[[60,64,67],[62,65,69],[64,67,71],[59,62,66]] }
};
function initAudioOnce(){
  if(audioReady){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=AC.createGain(); master.gain.value=muted?0:0.85; master.connect(AC.destination);
  sfxGain=AC.createGain(); sfxGain.gain.value=0.5; sfxGain.connect(master);
  musicGain=AC.createGain(); musicGain.gain.value=0.18; musicGain.connect(master);
  audioReady=true; startMusic();
}
function toggleMute(){ muted=!muted; if(master) master.gain.value=muted?0:0.85; document.getElementById('muteBtn').innerHTML=muted?'&#9834;&#824;':'&#9834;'; }
function duckMusic(v){ if(musicGain&&AC) musicGain.gain.setTargetAtTime(0.18*v, AC.currentTime, 0.05); }
function blip(o){
  if(!audioReady) return;
  const t0=AC.currentTime+(o.when||0); const dur=o.dur||0.1;
  const osc=AC.createOscillator(), g=AC.createGain();
  osc.type=o.type||'square';
  osc.frequency.setValueAtTime(o.f0||440,t0);
  if(o.f1 && o.f1!==o.f0) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1), t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(o.vol||0.3, t0+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g); g.connect(o.bus||sfxGain); osc.start(t0); osc.stop(t0+dur+0.03);
}
function noiseBurst(o){
  if(!audioReady) return;
  const t0=AC.currentTime+(o.when||0); const dur=o.dur||0.15;
  const buf=AC.createBuffer(1, Math.ceil(AC.sampleRate*dur), AC.sampleRate);
  const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type=o.filter||'lowpass'; f.frequency.value=o.freq||1400;
  const g=AC.createGain(); g.gain.setValueAtTime(o.vol||0.3,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(sfxGain); src.start(t0); src.stop(t0+dur);
}
function seq(notes,type,vol){ if(!audioReady) return; let w=0; for(const n of notes){ blip({type:type||'square', f0:n[0], f1:n[0], dur:n[1]*0.92, vol:vol||0.26, when:w}); w+=n[1]; } }
const sfxJump   = ()=> blip({type:'square', f0:300, f1:660, dur:0.15, vol:0.22});
const sfxStomp  = ()=> { noiseBurst({filter:'lowpass', freq:1100, dur:0.1, vol:0.32}); blip({type:'square', f0:220, f1:90, dur:0.1, vol:0.2}); };
const sfxCoin   = ()=> { blip({type:'square', f0:988, dur:0.06, vol:0.25}); blip({type:'square', f0:1319, dur:0.14, vol:0.25, when:0.06}); };
const sfxBump   = ()=> blip({type:'square', f0:180, f1:120, dur:0.08, vol:0.22});
const sfxBreak  = ()=> { noiseBurst({filter:'lowpass', freq:2600, dur:0.18, vol:0.4}); blip({type:'square', f0:240, f1:120, dur:0.1, vol:0.2}); };
const sfxKick   = ()=> blip({type:'square', f0:520, f1:180, dur:0.12, vol:0.25});

const sfxSprout = ()=> seq([[330,0.07],[440,0.07],[554,0.07],[659,0.12]],'square',0.24);
const sfxPowerup= ()=> seq([[392,0.06],[523,0.06],[659,0.06],[784,0.06],[1047,0.14]],'square',0.26);
const sfxShrink = ()=> { blip({type:'square', f0:520, f1:170, dur:0.22, vol:0.24}); noiseBurst({filter:'lowpass', freq:900, dur:0.12, vol:0.18}); };
const sfx1up    = ()=> seq([[659,0.1],[784,0.1],[1047,0.1],[1319,0.22]],'square',0.24);
const sfxFlag   = ()=> seq([[523,0.09],[659,0.09],[784,0.09],[1047,0.18]],'triangle',0.26);
const sfxFlagDn = ()=> blip({type:'square', f0:400, f1:200, dur:0.12, vol:0.2});
const sfxTick   = ()=> blip({type:'square', f0:1200, dur:0.03, vol:0.13});
const sfxClear  = ()=> seq([[523,0.13],[659,0.13],[784,0.13],[1047,0.13],[784,0.13],[1047,0.34]],'triangle',0.28);
const sfxDie    = ()=> seq([[440,0.14],[392,0.14],[330,0.14],[262,0.14],[196,0.32]],'triangle',0.28);
const sfxWin    = ()=> seq([[523,0.12],[523,0.12],[523,0.12],[523,0.18],[415,0.18],[466,0.18],[523,0.18],[1,0.1],[466,0.12],[523,0.4]],'square',0.26);
const sfxPause  = ()=> blip({type:'square', f0:600, dur:0.05, vol:0.18});
const sfxSpring = ()=> { blip({type:'square', f0:280, f1:1000, dur:0.16, vol:0.26}); blip({type:'square', f0:600, f1:1300, dur:0.1, vol:0.18, when:0.05}); };
const sfxCrumble= ()=> { noiseBurst({filter:'lowpass', freq:1700, dur:0.22, vol:0.34}); blip({type:'square', f0:200, f1:70, dur:0.2, vol:0.2}); };
const sfxBat    = ()=> blip({type:'triangle', f0:520, f1:360, dur:0.07, vol:0.14});
function buildSeq(track){
  const cfg=TRACKS[track]||TRACKS.map; SPB=60/cfg.bpm; const chords=cfg.chords;
  seqArr=[]; let tb=0; const e=0.5;
  if(cfg.style==='boss'){
    for(const ch of chords){
      for(let i=0;i<4;i++) seqArr.push({t:tb+i*e, dur:e*0.46, midi:ch[0]-12, voice:'bass'}); // pulsing 8th-note bass
      seqArr.push({t:tb+0,     dur:e*0.7, midi:ch[0]+12, voice:'lead'});
      seqArr.push({t:tb+e*0.5, dur:e*0.4, midi:ch[2]+12, voice:'lead'});
      seqArr.push({t:tb+e*1.0, dur:e*0.7, midi:ch[1]+12, voice:'lead'});
      seqArr.push({t:tb+e*1.5, dur:e*0.4, midi:ch[0]+19, voice:'lead'});
      tb+=2;
    }
    loopBeats=tb; return;
  }
  for(const ch of chords){
    const pat=[ch[0]+12, ch[1]+12, ch[2]+12, ch[1]+12];
    for(let i=0;i<4;i++) seqArr.push({t:tb+i*e, dur:e*0.9, midi:pat[i], voice:'lead'});
    seqArr.push({t:tb, dur:0.9, midi:ch[0]-12, voice:'bass'});
    seqArr.push({t:tb+1, dur:0.9, midi:ch[2]-12, voice:'bass'});
    tb+=2;
  }
  loopBeats=tb;
}
function setMusicTrack(name){
  if(!TRACKS[name] || name===curTrack) return;
  curTrack=name; buildSeq(name); schedIdx=0;
  if(audioReady && AC) loopStartTime=AC.currentTime+0.1;
}
const ntf = n=> 440*Math.pow(2,(n-69)/12);
function startMusic(){
  if(!audioReady||musicTimer) return;
  buildSeq(curTrack); loopStartTime=AC.currentTime+0.12; schedIdx=0;
  musicTimer=setInterval(()=>{
    if(!musicOn||!audioReady) return;
    const ahead=0.2;
    for(let guard=0; guard<64; guard++){
      const ev=seqArr[schedIdx]; const et=loopStartTime+ev.t*SPB;
      if(et < AC.currentTime+ahead){
        const o=AC.createOscillator(), g=AC.createGain();
        o.type = ev.voice==='lead'?'square':'triangle';
        o.frequency.value=ntf(ev.midi);
        const peak = ev.voice==='lead'?0.16:0.2;
        g.gain.setValueAtTime(0.0001,et);
        g.gain.linearRampToValueAtTime(peak, et+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, et+ev.dur*SPB);
        o.connect(g); g.connect(musicGain); o.start(et); o.stop(et+ev.dur*SPB+0.05);
        schedIdx++; if(schedIdx>=seqArr.length){ schedIdx=0; loopStartTime+=loopBeats*SPB; }
      } else break;
    }
  },30);
}

function genBoard(rng){
  const c=[];
  for(let y=0;y<ROWS;y++){ const r=[];
    for(let x=0;x<COLS;x++){
      if(x===0||y===0||x===COLS-1||y===ROWS-1) r.push('#');
      else if(x%2===0&&y%2===0) r.push('#');
      else r.push(' ');
    } c.push(r); }
  const corners=[[1,1],[COLS-2,ROWS-2],[COLS-2,1],[1,ROWS-2]];
  const keep=new Set();
  for(const [cx,cy] of corners){
    keep.add(cx+','+cy);
    keep.add((cx+(cx===1?1:-1))+','+cy);
    keep.add(cx+','+(cy+(cy===1?1:-1)));
  }
  for(let y=1;y<ROWS-1;y++) for(let x=1;x<COLS-1;x++){
    if(c[y][x]===' '&&!keep.has(x+','+y)&&rng()<SOFT_DENSITY) c[y][x]='B';
  }
  return {c,w:COLS,h:ROWS};
}
const bget=(x,y)=>{ const b=game.board; if(!b||!b.c[y]||b.c[y][x]==null) return '#'; return b.c[y][x]; };
const bset=(x,y,v)=>{ const b=game.board; if(b&&b.c[y]&&b.c[y][x]!=null) b.c[y][x]=v; };
function bombAt(tx,ty){ for(const b of game.bombs){ if(!b.dead&&b.tx===tx&&b.ty===ty) return b; } return null; }
function itemAt(tx,ty){ for(const it of game.items){ if(!it.dead&&it.tx===tx&&it.ty===ty) return it; } return null; }

class Fighter{
  constructor(idx,tx,ty,pal){
    this.idx=idx; this.pal=pal;
    this.cx=tx*TILE+TILE/2; this.cy=ty*TILE+TILE/2; this.r=5.2;
    this.alive=true; this.hearts=1; this.maxHearts=1; this.invinc=0;
    this.bombCap=1; this.fire=START_FIRE; this.speedUps=0; this.spdMul=1;
    this.kick=false; this.pierce=false; this.remote=false;
    this.dirX=0; this.dirY=1; this.walk=0; this.blinkT=rand(1,4); this.blink=false;
    this.squash=0; this.overBomb=null; this.cpu=false;
    this.aiT=rand(0,0.2); this.path=null; this.wantBomb=false; this.wdir=null;
  }
  get tx(){ return Math.floor(this.cx/TILE); }
  get ty(){ return Math.floor(this.cy/TILE); }
  canPass(tx,ty){ if(bget(tx,ty)!==' ') return false; const b=bombAt(tx,ty); if(b&&b!==this.overBomb) return false; return true; }
  _axis(ax,dv,assist){
    if(!dv) return false;
    const T=TILE,R=this.r,s=Math.sign(dv);
    const main= ax==='x'?this.cx:this.cy, perp= ax==='x'?this.cy:this.cx;
    const target=main+dv, leadT=Math.floor((target+s*R)/T);
    const p0=Math.floor((perp-R+0.5)/T), p1=Math.floor((perp+R-0.5)/T);
    const pass=(t,p)=> ax==='x'?this.canPass(t,p):this.canPass(p,t);
    let ok=true; for(let p=p0;p<=p1;p++) if(!pass(leadT,p)){ ok=false; break; }
    if(ok){ if(ax==='x')this.cx=target; else this.cy=target; return true; }
    const flush = s>0 ? leadT*T-R-0.01 : (leadT+1)*T+R+0.01;
    if((s>0&&flush>=main-0.001)||(s<0&&flush<=main+0.001)){ if(ax==='x')this.cx=flush; else this.cy=flush; }
    if(assist){
      const pc=Math.floor(perp/T);
      if(pass(leadT,pc)){
        const cgt=pc*T+T/2, d=cgt-perp;
        if(Math.abs(d)>0.4) this._axis(ax==='x'?'y':'x', Math.sign(d)*Math.min(Math.abs(dv),Math.abs(d)), false);
      }
    }
    return false;
  }
  move(dx,dy,dt){
    if(!this.alive) return;
    const spd=(WALK_BASE+this.speedUps*WALK_ADD)*this.spdMul*dt;
    let mx=dx?Math.sign(dx)*spd:0, my=dy?Math.sign(dy)*spd:0;
    if(mx&&my){ mx*=0.78; my*=0.78; }
    if(mx) this._axis('x',mx,true);
    if(my) this._axis('y',my,true);
    if(mx||my){
      if(mx) this.dirX=Math.sign(mx); if(my) this.dirY=Math.sign(my);
      if(mx&&!my) this.dirY=0; if(my&&!mx) this.dirX=0;
      this.walk+=(Math.abs(mx)+Math.abs(my))*0.16;
    }
    if(this.overBomb&&(this.overBomb.dead||this.overBomb.tx!==this.tx||this.overBomb.ty!==this.ty)) this.overBomb=null;
    if(this.kick&&this.alive){ if(dx) this._kickTry(Math.sign(dx),0); if(dy) this._kickTry(0,Math.sign(dy)); }
  }
  _kickTry(sdx,sdy){
    const T=TILE,R=this.r;
    const b=bombAt(this.tx+sdx,this.ty+sdy);
    if(!b||b===this.overBomb||b.dead||b.sliding) return;
    if(sdx!==0){
      if(Math.abs(this.cy-(this.ty*T+T/2))>5) return;          // must share the row lane
      const edge=sdx>0?(this.tx+1)*T:this.tx*T;
      if(Math.abs((this.cx+sdx*R)-edge)>2.0) return;           // must be pressed against it
    } else {
      if(Math.abs(this.cx-(this.tx*T+T/2))>5) return;
      const edge=sdy>0?(this.ty+1)*T:this.ty*T;
      if(Math.abs((this.cy+sdy*R)-edge)>2.0) return;
    }
    if(!bombSlideClear(b.tx+sdx,b.ty+sdy,b)) return;           // tile beyond must be open
    b.sliding=true; b.sdx=sdx; b.sdy=sdy; b.px=b.tx*T+T/2; b.py=b.ty*T+T/2;
  }
  dropBomb(){
    if(!this.alive) return;
    const tx=this.tx,ty=this.ty;
    if(bombAt(tx,ty)) return;
    let n=0; for(const b of game.bombs) if(!b.dead&&b.owner===this.idx) n++;
    if(n>=this.bombCap) return;
    const b=new Bomb(tx,ty,this.idx,this.fire,this.pierce,(this.remote&&this.idx===0));
    game.bombs.push(b); this.overBomb=b; sfxPlaceBomb();
  }
  hit(){
    if(!this.alive||this.invinc>0) return;
    this.hearts--; sfxShrink();
    if(this.hearts<=0){ this.alive=false; this.squash=0.7; spawnSparks(this.cx,this.cy,'#ffffff',14);
      for(const b of game.bombs){ if(!b.dead&&b.owner===this.idx&&b.remote){ b.remote=false; } } }
    else { this.invinc=2.2; spawnSparks(this.cx,this.cy,'#ffd23a',10); }
  }
  applyItem(t){
    if(t==='bomb') this.bombCap=Math.min(MAX_BOMBS,this.bombCap+1);
    else if(t==='fire') this.fire=Math.min(MAX_FIRE,this.fire+1);
    else if(t==='speed') this.speedUps=Math.min(MAX_SPEED,this.speedUps+1);
    else if(t==='kick') this.kick=true;
    else if(t==='pierce') this.pierce=true;
    else if(t==='remote') this.remote=true;
    sfxPick();
    if(this.idx===0){
      const lbl={bomb:'ボム+1',fire:'ファイア+1',speed:'スピード+1',kick:'キック！',pierce:'つらぬき！',remote:'リモコン！'}[t]||'';
      pushPop(this.cx,this.cy-12, lbl);
    }
  }
  update(dt){
    if(this.invinc>0) this.invinc-=dt;
    if(this.squash>0) this.squash-=dt;
    this.blinkT-=dt;
    if(this.blinkT<=0){ this.blink=!this.blink; this.blinkT=this.blink?0.12:rand(1.5,4); }
    if(this.alive){ const it=itemAt(this.tx,this.ty); if(it){ it.dead=true; this.applyItem(it.type); } }
  }
}

const KICK_SPEED=120;   // px/sec for a kicked bomb sliding across the board
class Bomb{
  constructor(tx,ty,owner,range,pierce,remote){ this.tx=tx; this.ty=ty; this.owner=owner; this.range=range; this.pierce=!!pierce; this.remote=!!remote; this.t=FUSE_T; this.dead=false; this.anim=0; this.sliding=false; this.sdx=0; this.sdy=0; this.px=tx*TILE+TILE/2; this.py=ty*TILE+TILE/2; }
  _slide(dt){
    const T=TILE, sp=KICK_SPEED*dt;
    this.px+=this.sdx*sp; this.py+=this.sdy*sp;
    this.tx=Math.floor(this.px/T); this.ty=Math.floor(this.py/T);
    const cX=this.tx*T+T/2, cY=this.ty*T+T/2;
    const passed = this.sdx>0?this.px>=cX : this.sdx<0?this.px<=cX : this.sdy>0?this.py>=cY : this.py<=cY;
    if(passed && !bombSlideClear(this.tx+this.sdx,this.ty+this.sdy,this)){
      this.px=cX; this.py=cY; this.sliding=false; this.sdx=0; this.sdy=0;
    }
  }
  update(dt){
    if(this.dead) return;
    this.anim+=dt;
    if(this.sliding) this._slide(dt);
    if(!this.remote){ this.t-=dt; if(this.t<=0) explodeBomb(this); }
  }
}

function bombSlideClear(x,y,self){
  if(bget(x,y)!==' ') return false;
  const b=bombAt(x,y); if(b&&b!==self) return false;
  for(const f of game.fighters){ if(f.alive&&f.tx===x&&f.ty===y) return false; }
  return true;
}
function blastCellsFor(tx,ty,range,pierce){
  const cells=[{tx,ty,o:'c',end:false}];
  const dirs=[[1,0,'h'],[-1,0,'h'],[0,1,'v'],[0,-1,'v']];
  for(const [dx,dy,o] of dirs){
    for(let i=1;i<=range;i++){
      const x=tx+dx*i,y=ty+dy*i, ch=bget(x,y);
      if(ch==='#') break;
      if(ch==='B'){ cells.push({tx:x,ty:y,o,end:!pierce,soft:true}); if(pierce) continue; break; }
      const cell={tx:x,ty:y,o,end:i===range}; cells.push(cell);
      if(bombAt(x,y)){ cell.end=true; break; }
    }
  }
  return cells;
}
function explodeBomb(b){
  if(b.dead) return; b.dead=true; sfxBoom();
  const cells=blastCellsFor(b.tx,b.ty,b.range,b.pierce);
  for(const c of cells){
    if(c.soft){ bset(c.tx,c.ty,' '); spawnDebris(c.tx,c.ty); if(Math.random()<ITEM_RATE) spawnRandomItem(c.tx,c.ty); }
    const ob=bombAt(c.tx,c.ty); if(ob&&ob!==b&&!ob.dead){ ob.remote=false; ob.t=Math.min(ob.t,0.08); }
    const it=itemAt(c.tx,c.ty); if(it){ it.dead=true; spawnSparks(c.tx*TILE+8,c.ty*TILE+8,'#ffffff',5); }
  }
  game.blasts.push({cells,t:BLAST_T,max:BLAST_T,owner:b.owner});
  spawnSparks(b.tx*TILE+8,b.ty*TILE+8,'#ffd23a',12);
}

class Item{
  constructor(tx,ty,type){ this.tx=tx; this.ty=ty; this.type=type; this.t=0; this.dead=false; }
  update(dt){ this.t+=dt; }
}
function spawnRandomItem(tx,ty){
  const r=Math.random();
  // core items stay common; the three abilities are rarer one-time pickups
  const type = r<0.26?'bomb' : r<0.52?'fire' : r<0.70?'speed' : r<0.80?'kick' : r<0.90?'pierce' : 'remote';
  game.items.push(new Item(tx,ty,type));
}

class Spark{
  constructor(x,y,vx,vy,col,size,life,g){ this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.col=col;this.size=size;this.life=life;this.t=life;this.g=g||0;this.dead=false; }
  update(dt){ this.t-=dt; if(this.t<=0){ this.dead=true; return; } this.vy+=this.g; this.x+=this.vx; this.y+=this.vy; }
}
function spawnSparks(x,y,col,n){
  for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=rand(0.5,2.4);
    game.parts.push(new Spark(x,y,Math.cos(a)*s,Math.sin(a)*s,col,rand(1.5,3),rand(0.25,0.6),0.05)); }
}
function spawnDebris(tx,ty){
  const cx=tx*TILE+8, cy=ty*TILE+8;
  for(let i=0;i<8;i++) game.parts.push(new Spark(cx,cy,rand(-1.6,1.6),rand(-2.4,-0.4),'#9c5424',rand(2,3.5),rand(0.4,0.8),0.14));
}
function pushPop(x,y,txt,col){ game.popups.push({x,y,txt,col:col||'#fff',t:0.9}); }



// ===== src/game/ai.js =====

function dangerGrid(extra){
  const g=new Array(COLS*ROWS).fill(Infinity);
  const mark=(cells,t)=>{ for(const c of cells){ const i=c.ty*COLS+c.tx; if(t<g[i]) g[i]=t; } };
  for(const b of game.bombs){ if(!b.dead) mark(blastCellsFor(b.tx,b.ty,b.range,b.pierce), Math.max(0,b.t)); }
  for(const bl of game.blasts) mark(bl.cells,0);
  if(extra) mark(extra.cells, extra.t);
  return g;
}
function aiPass(f,tx,ty){ if(bget(tx,ty)!==' ') return false; const b=bombAt(tx,ty); if(b&&b!==f.overBomb) return false; return true; }
function bfsPath(f,sx,sy,goalFn,dgr,tileTime){
  const key=(x,y)=>y*COLS+x;
  const q=[[sx,sy,0]]; const prev=new Map(); prev.set(key(sx,sy),-1);
  while(q.length){
    const [x,y,d]=q.shift();
    if(goalFn(x,y,d)){
      const pth=[]; let k=key(x,y);
      while(k!==-1){ pth.push([k%COLS,(k/COLS)|0]); k=prev.get(k); }
      return pth.reverse();
    }
    if(d>40) continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy,k=key(nx,ny);
      if(prev.has(k)) continue;
      if(!aiPass(f,nx,ny)) continue;
      const dg=dgr?dgr[k]:Infinity;
      if(dg!==Infinity && dg < (d+1)*tileTime+0.45) continue;
      prev.set(k,key(x,y)); q.push([nx,ny,d+1]);
    }
  }
  return null;
}
function softNeighbor(x,y){ return bget(x+1,y)==='B'||bget(x-1,y)==='B'||bget(x,y+1)==='B'||bget(x,y-1)==='B'; }
function enemyInLine(f){
  for(const o of game.fighters){
    if(o===f||!o.alive) continue;
    if(o.ty===f.ty&&Math.abs(o.tx-f.tx)<=f.fire){
      let clear=true; const s=Math.sign(o.tx-f.tx);
      for(let x=f.tx+s;x!==o.tx;x+=s){ if(bget(x,f.ty)!==' '){ clear=false; break; } }
      if(clear) return true;
    }
    if(o.tx===f.tx&&Math.abs(o.ty-f.ty)<=f.fire){
      let clear=true; const s=Math.sign(o.ty-f.ty);
      for(let y=f.ty+s;y!==o.ty;y+=s){ if(bget(f.tx,y)!==' '){ clear=false; break; } }
      if(clear) return true;
    }
  }
  return false;
}
function nearEnemyTile(f,x,y){
  for(const o of game.fighters){ if(o===f||!o.alive) continue; if(Math.abs(o.tx-x)+Math.abs(o.ty-y)<=2) return true; }
  return false;
}
function bombsAvail(f){ let n=0; for(const b of game.bombs) if(!b.dead&&b.owner===f.idx) n++; return n<f.bombCap; }
function escapeOk(f,tileTime){
  const sim={cells:blastCellsFor(f.tx,f.ty,f.fire,f.pierce),t:FUSE_T};
  const g2=dangerGrid(sim);
  return !!bfsPath(f,f.tx,f.ty,(x,y,d)=>d>0&&g2[y*COLS+x]===Infinity,g2,tileTime);
}
function cpuUpdate(f,dt){
  const D=game.diff.cpu;
  const tileTime=TILE/(((WALK_BASE+f.speedUps*13)*D.spd)||1);
  f.aiT-=dt;
  if(f.aiT<=0){
    f.aiT=D.think;
    const dgr=dangerGrid();
    const here=f.ty*COLS+f.tx;
    f.wantBomb=false;
    if(dgr[here]!==Infinity){
      f.path=bfsPath(f,f.tx,f.ty,(x,y,d)=>d>0&&dgr[y*COLS+x]===Infinity,dgr,tileTime);
    } else {
      const wants=Math.random()<D.bombProb && bombsAvail(f) && (softNeighbor(f.tx,f.ty)||enemyInLine(f));
      if(wants && escapeOk(f,tileTime)){ f.wantBomb=true; f.path=null; }
      else {
        f.path = bfsPath(f,f.tx,f.ty,(x,y,d)=>d>0&&!!itemAt(x,y),dgr,tileTime)
              || bfsPath(f,f.tx,f.ty,(x,y,d)=>d>0&&softNeighbor(x,y),dgr,tileTime)
              || bfsPath(f,f.tx,f.ty,(x,y,d)=>d>0&&nearEnemyTile(f,x,y),dgr,tileTime);
        if(D.smart<1 && Math.random()>D.smart) f.path=null;
      }
    }
  }
  if(f.wantBomb){ f.dropBomb(); f.wantBomb=false; f.aiT=Math.min(f.aiT,0.05); return {dx:0,dy:0}; }
  if(f.path&&f.path.length>1){
    const [nx,ny]=f.path[1];
    const dx=nx*TILE+TILE/2-f.cx, dy=ny*TILE+TILE/2-f.cy;
    if(Math.abs(dx)<1.2&&Math.abs(dy)<1.2){ f.path.shift(); return {dx:0,dy:0}; }
    return {dx:Math.abs(dx)>1.2?Math.sign(dx):0, dy:Math.abs(dy)>1.2?Math.sign(dy):0};
  }
  if(!f.wdir||Math.random()<0.02){ const ds=[[1,0],[-1,0],[0,1],[0,-1]]; f.wdir=ds[(Math.random()*4)|0]; }
  return {dx:f.wdir[0],dy:f.wdir[1]};
}

// The boss is kept OUT of game.fighters so the last-standing win logic ignores it;
// flow.js updates it and checks player-blast overlap for damage. It is a big sprite
// on a small footprint (one tile) that navigates the corridors like a fighter.
class Boss{
  constructor(tx,ty,pal){
    this.pal=pal; this.cx=tx*TILE+TILE/2; this.cy=ty*TILE+TILE/2; this.r=6;
    this.hp=BOSS_HP; this.maxHp=BOSS_HP; this.alive=true; this.invinc=0; this.hitFlash=0;
    this.dirX=0; this.dirY=1; this.walk=0; this.squash=0;
    this.mvx=0; this.mvy=0;
    this.bombT=BOSS_BOMB_EVERY*0.6; this.slamT=BOSS_SLAM_EVERY; this.slamWarn=0; this.deathSpark=0;
  }
  get tx(){ return Math.floor(this.cx/TILE); }
  get ty(){ return Math.floor(this.cy/TILE); }
  _canPass(tx,ty){ if(tx<0||ty<0||tx>=COLS||ty>=ROWS) return false; if(bget(tx,ty)!==' ') return false; if(bombAt(tx,ty)) return false; return true; }
  _atCenter(){ const T=TILE; return Math.abs(this.cx-(this.tx*T+T/2))<1.2 && Math.abs(this.cy-(this.ty*T+T/2))<1.2; }
  _snapToCenter(){ const T=TILE; this.cx=this.tx*T+T/2; this.cy=this.ty*T+T/2; }
  _chooseDir(){
    const dgr=dangerGrid();
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    const passSafe=(dx,dy)=>{ const tx=this.tx+dx,ty=this.ty+dy; return this._canPass(tx,ty) && dgr[ty*COLS+tx]===Infinity; };
    // standing in danger → flee toward the safest reachable neighbour
    if(dgr[this.ty*COLS+this.tx]!==Infinity){
      let best=null,bestScore=-1;
      for(const [dx,dy] of dirs){ const tx=this.tx+dx,ty=this.ty+dy; if(!this._canPass(tx,ty)) continue; const s=dgr[ty*COLS+tx]===Infinity?999:dgr[ty*COLS+tx]; if(s>bestScore){ bestScore=s; best=[dx,dy]; } }
      if(best){ this.mvx=best[0]; this.mvy=best[1]; return; }
    }
    // chase the player along the larger gap, only into safe tiles
    const pl=game.fighters[0];
    if(pl&&pl.alive){
      const ddx=pl.tx-this.tx, ddy=pl.ty-this.ty, order=[];
      if(Math.abs(ddx)>=Math.abs(ddy)){ if(ddx)order.push([Math.sign(ddx),0]); if(ddy)order.push([0,Math.sign(ddy)]); }
      else { if(ddy)order.push([0,Math.sign(ddy)]); if(ddx)order.push([Math.sign(ddx),0]); }
      for(const [dx,dy] of order){ if(passSafe(dx,dy)){ this.mvx=dx; this.mvy=dy; return; } }
    }
    // keep going if still safe, else pick a random safe lane, else any open lane
    if((this.mvx||this.mvy) && passSafe(Math.sign(this.mvx),Math.sign(this.mvy))) return;
    const safe=dirs.filter(([dx,dy])=>passSafe(dx,dy));
    if(safe.length){ const d=safe[(Math.random()*safe.length)|0]; this.mvx=d[0]; this.mvy=d[1]; return; }
    const open=dirs.filter(([dx,dy])=>this._canPass(this.tx+dx,this.ty+dy));
    if(open.length){ const d=open[(Math.random()*open.length)|0]; this.mvx=d[0]; this.mvy=d[1]; return; }
    this.mvx=0; this.mvy=0;
  }
  move(dt){
    const spd=WALK_BASE*BOSS_SPD*dt, T=TILE;
    if(this.mvx){
      const past = this.mvx>0 ? this.cx<this.tx*T+T/2 : this.cx>this.tx*T+T/2;
      if(this._canPass(this.tx+Math.sign(this.mvx),this.ty) || past){ this.cx+=Math.sign(this.mvx)*spd; this.dirX=Math.sign(this.mvx); this.dirY=0; this.walk+=spd*0.16; }
    } else if(this.mvy){
      const past = this.mvy>0 ? this.cy<this.ty*T+T/2 : this.cy>this.ty*T+T/2;
      if(this._canPass(this.tx,this.ty+Math.sign(this.mvy)) || past){ this.cy+=Math.sign(this.mvy)*spd; this.dirY=Math.sign(this.mvy); this.dirX=0; this.walk+=spd*0.16; }
    }
  }
  _dropBomb(){
    const tx=this.tx,ty=this.ty;
    if(bombAt(tx,ty)) return;
    let n=0; for(const b of game.bombs) if(!b.dead&&b.owner===BOSS_OWNER) n++;
    if(n>=2) return;
    game.bombs.push(new Bomb(tx,ty,BOSS_OWNER,BOSS_BOMB_RANGE,false,false)); sfxPlaceBomb();
  }
  _slam(){
    const cells=blastCellsFor(this.tx,this.ty,BOSS_SLAM_RANGE,false);
    for(const c of cells){ if(c.soft){ bset(c.tx,c.ty,' '); spawnDebris(c.tx,c.ty); } }
    game.blasts.push({cells,t:BLAST_T,max:BLAST_T,owner:BOSS_OWNER});
    spawnSparks(this.cx,this.cy,'#ff7ad6',20); sfxStomp();
  }
  hit(){
    if(!this.alive||this.invinc>0) return;
    this.hp--; this.invinc=BOSS_HIT_INVINC; this.hitFlash=0.25;
    spawnSparks(this.cx,this.cy,'#ffd23a',16); sfxShrink();
    if(this.hp<=0){ this.alive=false; this.squash=1.2; this.deathSpark=0; spawnSparks(this.cx,this.cy,'#ffffff',34); sfxBoom(); }
  }
  update(dt){
    if(!this.alive){
      if(this.squash>0){
        this.squash=Math.max(0,this.squash-dt);
        this.deathSpark-=dt;
        if(this.deathSpark<=0){ this.deathSpark=0.16; const c=['#ffd23a','#ff7ad6','#ffffff'][(Math.random()*3)|0]; spawnSparks(this.cx+(Math.random()-0.5)*16,this.cy+(Math.random()-0.5)*16,c,8); }
      }
      return;
    }
    if(this.invinc>0) this.invinc-=dt;
    if(this.hitFlash>0) this.hitFlash-=dt;
    if(this.slamWarn>0){ this.slamWarn-=dt; if(this.slamWarn<=0) this._slam(); this.move(dt); return; }
    this.bombT-=dt; if(this.bombT<=0){ this.bombT=BOSS_BOMB_EVERY; this._dropBomb(); }
    this.slamT-=dt; if(this.slamT<=0){ this.slamT=BOSS_SLAM_EVERY; this.slamWarn=BOSS_SLAM_WARN; this.mvx=0; this.mvy=0; this.move(dt); return; }
    if(this._atCenter()){ this._snapToCenter(); this._chooseDir(); }
    this.move(dt);
  }
}


// ===== src/game/flow.js =====

const SAVE_KEY='brambleBoom.save';
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return;
    const d=JSON.parse(raw);
    if(typeof d.difficulty==='number') game.save.difficulty=Math.max(0,Math.min(2,d.difficulty|0));
    if(typeof d.cpuCount==='number') game.save.cpuCount=Math.max(1,Math.min(3,d.cpuCount|0));
    if(typeof d.themeSel==='number') game.save.themeSel=Math.max(0,Math.min(5,d.themeSel|0));
    if(typeof d.charSel==='number') game.save.charSel=Math.max(0,Math.min(CHARS.length-1,d.charSel|0));
    if(typeof d.w==='number') game.save.w=d.w|0;
    if(typeof d.l==='number') game.save.l=d.l|0;
  }catch(_){ }
  game.diff=DIFFICULTY[game.save.difficulty];
}
function persistSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(game.save)); }catch(_){ } }

function applyCharPower(f){
  const p=f.pal&&f.pal.power;
  if(p==='heart') f.hearts+=1;          // タフ：ハート+1
  else if(p==='speed') f.spdMul=1.18;   // すばやい：はやく うごく
  else if(p==='bomb') f.bombCap+=1;     // ボムたくさん：ボム+1
  else if(p==='fire') f.fire+=1;        // パワフル：ばくはつ+1
}
function startMatch(opts){
  opts=opts||{};
  const seed=(opts.seed!=null?opts.seed:(Math.random()*1e9))|0;
  const rng=mulberry32(seed);
  game.diff=DIFFICULTY[game.save.difficulty];
  game.bossMode=!!opts.boss;
  const ti = game.bossMode ? 4 : (game.save.themeSel===5 ? (rng()*THEMES.length)|0 : game.save.themeSel);
  game.themeIdx=ti; game.theme=THEMES[ti];
  game.board=genBoard(rng);
  game.fighters=[]; game.boss=null;
  const pchar=CHARS[Math.max(0,Math.min(CHARS.length-1,game.save.charSel|0))];
  if(game.bossMode){
    const pf=new Fighter(0,1,1,pchar); pf.hearts=BOSS_PLAYER_HEARTS; applyCharPower(pf); pf.maxHearts=pf.hearts; game.fighters.push(pf);
    const bx=(COLS/2)|0, by=(ROWS/2)|0;
    for(let yy=by-1;yy<=by+1;yy++) for(let xx=bx-1;xx<=bx+1;xx++){ if(bget(xx,yy)==='B') bset(xx,yy,' '); }
    game.boss=new Boss(bx,by,BOSS);
  } else {
    const n=1+game.save.cpuCount;
    const spawns=[[1,1],[COLS-2,ROWS-2],[COLS-2,1],[1,ROWS-2]];
    // Pick distinct enemy "pests" for the CPUs (seeded → reproducible per match).
    const epool=ENEMIES.map((_,k)=>k);
    for(let k=epool.length-1;k>0;k--){ const j=(rng()*(k+1))|0; const t=epool[k]; epool[k]=epool[j]; epool[j]=t; }
    for(let i=0;i<n;i++){
      const pal = i===0 ? pchar : ENEMIES[epool[(i-1)%ENEMIES.length]];
      const f=new Fighter(i,spawns[i][0],spawns[i][1],pal);
      if(i>0){ f.cpu=true; f.spdMul=game.diff.cpu.spd; }
      else { f.hearts=game.diff.hearts; applyCharPower(f); f.maxHearts=f.hearts; }
      game.fighters.push(f);
    }
  }
  game.bombs=[]; game.blasts=[]; game.items=[]; game.parts=[]; game.popups=[];
  game.time=game.bossMode?BOSS_TIME:ROUND_TIME; game.phase='count'; game.countT=3.2; game.lastC=99;
  game.winner=-2; game.endT=0; game.paused=false; game.state='battle';
  setMusicTrack(game.bossMode?'boss':['overworld','water','sky','castle','magma'][ti]); duckMusic(1);
}
function returnToTitle(){
  game.paused=false; game.state='title';
  setMusicTrack('map'); duckMusic(1); persistSave();
}
function tickFX(dt){
  for(const p of game.parts) p.update(dt);
  for(const it of game.items) it.update(dt);
  for(const pp of game.popups){ pp.t-=dt; pp.y-=14*dt; }
  game.parts=game.parts.filter(p=>!p.dead);
  game.popups=game.popups.filter(p=>p.t>0);
}
function finishRound(w){
  game.phase='end'; game.endT=0; game.winner=w; duckMusic(0.55);
  if(w===0){ game.save.w++; sfxWin(); }
  else if(w>0){ game.save.l++; sfxDie(); }
  else sfxClear();
  persistSave();
}
function updateBattle(dt){
  if(game.phase==='count'){
    game.countT-=dt;
    const c=Math.ceil(game.countT);
    if(c!==game.lastC){ game.lastC=c; if(c>0) sfxCount(); else sfxGo(); }
    if(game.countT<=-0.6) game.phase='play';
    tickFX(dt);
    return;
  }
  if(game.phase==='end'){
    game.endT+=dt; tickFX(dt);
    if(game.endT>0.9 && (edge.bomb||edge.start||game.oneShotStart)){ game.oneShotStart=false; startMatch({}); }
    return;
  }
  if(edge.pause){ game.paused=true; game.pauseSel=0; duckMusic(0); sfxPause(); return; }
  game.time-=dt;
  const p=game.fighters[0];
  if(p&&p.alive){
    const dx=(input.right?1:0)-(input.left?1:0);
    const dy=(input.down?1:0)-(input.up?1:0);
    p.move(dx,dy,dt);
    if(edge.bomb) p.dropBomb();
    if(edge.detonate&&p.remote){ for(const b of game.bombs){ if(!b.dead&&b.owner===0&&b.remote) explodeBomb(b); } }
  }
  for(const f of game.fighters){
    if(f.cpu&&f.alive){ const mv=cpuUpdate(f,dt); f.move(mv.dx,mv.dy,dt); }
    f.update(dt);
  }
  if(game.bossMode&&game.boss) game.boss.update(dt);
  for(const b of game.bombs) b.update(dt);
  for(const bl of game.blasts) bl.t-=dt;
  for(const bl of game.blasts){
    if(bl.t<=0) continue;
    for(const c of bl.cells){
      for(const f of game.fighters){
        if(f.alive&&f.invinc<=0&&f.tx===c.tx&&f.ty===c.ty) f.hit();
      }
    }
  }
  // the boss takes damage only from the player's own blasts (its footprint is ~3x3 so it's hittable)
  if(game.bossMode&&game.boss&&game.boss.alive){
    for(const bl of game.blasts){
      if(bl.t<=0||bl.owner!==0) continue;
      let hitB=false;
      for(const c of bl.cells){ if(Math.abs(c.tx-game.boss.tx)<=1&&Math.abs(c.ty-game.boss.ty)<=1){ hitB=true; break; } }
      if(hitB){ game.boss.hit(); break; }
    }
  }
  game.bombs=game.bombs.filter(b=>!b.dead);
  game.blasts=game.blasts.filter(b=>b.t>0);
  game.items=game.items.filter(i=>!i.dead);
  tickFX(dt);
  if(game.bossMode){
    if(game.boss&&!game.boss.alive){ if(game.boss.squash<=0) finishRound(0); }   // win once the defeat sequence ends
    else if(!(p&&p.alive)) finishRound(1);                    // player down → lose
    else if(game.time<=0) finishRound(1);                     // ran out of time → lose
  } else {
    const alive=game.fighters.filter(f=>f.alive);
    if(alive.length<=1) finishRound(alive.length?alive[0].idx:-1);
    else if(game.time<=0) finishRound(-1);
  }
}
function pausedMenu(){
  if(edge.pause){ game.paused=false; duckMusic(1); sfxPause(); return; }
  if(edge.left&&game.pauseSel!==0){ game.pauseSel=0; sfxJump(); }
  else if(edge.right&&game.pauseSel!==1){ game.pauseSel=1; sfxJump(); }
  else if(edge.bomb||edge.start){
    if((game.pauseSel|0)===1) returnToTitle();
    else { game.paused=false; duckMusic(1); sfxPause(); }
  }
}

function buddyAcc(pal,cx,top,u){
  u=u||1;
  ctx.save(); ctx.translate(cx,top); ctx.scale(u,u);
  if(pal.acc==='sprout'){
    ctx.strokeStyle='#3a9e33'; ctx.lineWidth=1.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,1); ctx.lineTo(0,-4.2); ctx.stroke();
    ctx.fillStyle='#5fd24a';
    for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(0,-3.4); ctx.quadraticCurveTo(s*4.6,-7.6,s*6.2,-3.4); ctx.quadraticCurveTo(s*3.2,-1.8,0,-3.4); ctx.fill(); }
    ctx.fillStyle='#ffe46a'; ctx.beginPath(); ctx.arc(0,-4.8,1.2,0,7); ctx.fill();
  } else if(pal.acc==='leaf'){
    ctx.fillStyle='#39b85e'; ctx.beginPath(); ctx.moveTo(-1,0.6); ctx.quadraticCurveTo(-6.4,-5.6,1.6,-8.8); ctx.quadraticCurveTo(6.8,-4.4,-1,0.6); ctx.fill();
    ctx.strokeStyle='#1d6e36'; ctx.lineWidth=0.9; ctx.beginPath(); ctx.moveTo(-0.4,-0.6); ctx.lineTo(1.4,-7.2); ctx.stroke();
  } else if(pal.acc==='drop'){
    ctx.fillStyle='#8cc4ff'; ctx.beginPath(); ctx.moveTo(0,-8.4); ctx.quadraticCurveTo(4,-2.6,0,0.8); ctx.quadraticCurveTo(-4,-2.6,0,-8.4); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.92)'; ellipse(-1.2,-4,1.1,1.6);
  } else if(pal.acc==='flower'){
    ctx.fillStyle='#fff';
    for(let i=0;i<5;i++){ const a=i/5*6.28-1.57; ctx.beginPath(); ctx.arc(Math.cos(a)*3.2,-4.8+Math.sin(a)*3.2,2.1,0,7); ctx.fill(); }
    ctx.fillStyle='#ffd24d'; ctx.beginPath(); ctx.arc(0,-4.8,1.8,0,7); ctx.fill();
  }
  ctx.restore();
}
function drawBuddy(cx,feet,size,pal,o){
  o=o||{};
  const bw=size*0.92, bh=size, ko=!!o.ko, u=size/13;
  const sy=ko?0.45:1, top=feet-bh*sy;
  const bob=ko?0:Math.abs(Math.sin(o.walk||0))*1.4*u;
  ctx.fillStyle='rgba(0,0,0,0.2)'; ellipse(cx,feet+1.5*u,bw*0.6,2.4*u);
  if(!ko){
    const w=Math.sin(o.walk||0);
    ctx.fillStyle=pal.shade;
    rr(ctx,cx-bw*0.38,feet-3.2*u-(w>0?1.4*u:0),bw*0.3,3.4*u,1.6*u); ctx.fill();
    rr(ctx,cx+bw*0.08,feet-3.2*u-(w<0?1.4*u:0),bw*0.3,3.4*u,1.6*u); ctx.fill();
  }
  const g=ctx.createLinearGradient(0,top-bob,0,feet);
  g.addColorStop(0,pal.top); g.addColorStop(0.55,pal.body); g.addColorStop(1,pal.shade);
  ctx.fillStyle=g; rr(ctx,cx-bw/2,top-bob,bw,bh*sy,Math.min(bw,bh)*0.46); ctx.fill();
  ctx.fillStyle=pal.belly; rr(ctx,cx-bw*0.3,top-bob+bh*sy*0.46,bw*0.6,bh*sy*0.48,bw*0.25); ctx.fill();
  ctx.save(); ctx.globalAlpha=0.5; ctx.fillStyle='rgba(255,255,255,0.9)'; ellipse(cx-bw*0.22,top-bob+bh*sy*0.16,bw*0.2,bh*0.1); ctx.restore();
  ctx.strokeStyle=pal.out; ctx.lineWidth=1.1*u; rr(ctx,cx-bw/2,top-bob,bw,bh*sy,Math.min(bw,bh)*0.46); ctx.stroke();
  if(!ko) buddyAcc(pal,cx,top-bob,u);
  const eyeY=top-bob+bh*sy*0.40, eo=bw*0.23;
  const lookX=(o.dirX||0)*1.1*u, lookY=(o.dirY||0)*0.6*u;
  if(ko){
    ctx.strokeStyle=pal.out; ctx.lineWidth=1.4*u;
    for(const s of [-1,1]){ const ex=cx+s*eo;
      ctx.beginPath(); ctx.moveTo(ex-2.2*u,eyeY-2.2*u); ctx.lineTo(ex+2.2*u,eyeY+2.2*u); ctx.moveTo(ex+2.2*u,eyeY-2.2*u); ctx.lineTo(ex-2.2*u,eyeY+2.2*u); ctx.stroke(); }
    return;
  }
  for(const s of [-1,1]){
    const ex=cx+s*eo;
    ctx.fillStyle='#fff'; ellipse(ex,eyeY,3.0*u,3.5*u);
    if(o.blink){ ctx.strokeStyle=pal.out; ctx.lineWidth=1.2*u; ctx.beginPath(); ctx.moveTo(ex-2.4*u,eyeY); ctx.lineTo(ex+2.4*u,eyeY); ctx.stroke(); }
    else{
      ctx.fillStyle='#2a1810'; ellipse(ex+lookX,eyeY+0.5*u+lookY,1.5*u,1.95*u);
      ctx.fillStyle='rgba(255,255,255,0.98)'; ellipse(ex+lookX-0.7*u,eyeY-0.7*u+lookY,0.85*u,0.9*u);
      ctx.fillStyle='rgba(255,255,255,0.6)'; ellipse(ex+lookX+0.7*u,eyeY+1.0*u+lookY,0.42*u,0.42*u);
    }
  }
  ctx.strokeStyle=pal.out; ctx.lineWidth=1*u; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx+lookX*0.4,eyeY+bh*0.15,bw*0.12,0.16*Math.PI,0.84*Math.PI); ctx.stroke(); ctx.lineCap='butt';
  ctx.save(); ctx.globalAlpha=0.55; ctx.fillStyle=pal.cheek; ellipse(cx-bw*0.34,eyeY+bh*0.12,1.9*u,1.25*u); ellipse(cx+bw*0.34,eyeY+bh*0.12,1.9*u,1.25*u); ctx.restore();
}
function drawCritter(cx,feet,size,pal,o){
  o=o||{}; const ko=!!o.ko;
  const w=Math.sin(o.walk||0), bob=ko?0:Math.abs(w)*1.3;
  const out=pal.out, eyeCol=pal.eye||'#201810';
  const lookX=(o.dirX||0)*1.1, lookY=(o.dirY||0)*0.6;
  ctx.save();
  // shared eye routine (KO draws X eyes)
  const eyes=(eyeY,eo,rx,ry)=>{
    if(ko){ ctx.strokeStyle=out; ctx.lineWidth=1.4;
      for(const s of [-1,1]){ const ex=cx+s*eo;
        ctx.beginPath(); ctx.moveTo(ex-2,eyeY-2); ctx.lineTo(ex+2,eyeY+2); ctx.moveTo(ex+2,eyeY-2); ctx.lineTo(ex-2,eyeY+2); ctx.stroke(); }
      return; }
    for(const s of [-1,1]){ const ex=cx+s*eo;
      ctx.fillStyle='#fff'; ellipse(ex,eyeY,rx,ry);
      if(o.blink){ ctx.strokeStyle=out; ctx.lineWidth=1.1; ctx.beginPath(); ctx.moveTo(ex-rx*0.8,eyeY); ctx.lineTo(ex+rx*0.8,eyeY); ctx.stroke(); }
      else{ ctx.fillStyle=eyeCol; ellipse(ex+lookX,eyeY+0.3+lookY,rx*0.46,ry*0.5);
            ctx.fillStyle='rgba(255,255,255,0.95)'; ellipse(ex+lookX-0.5,eyeY-0.5+lookY,0.55,0.55); } }
  };
  const grad=(top,h)=>{ const g=ctx.createLinearGradient(0,top,0,top+h); g.addColorStop(0,pal.top); g.addColorStop(0.55,pal.body); g.addColorStop(1,pal.shade); return g; };
  ctx.fillStyle='rgba(0,0,0,0.2)'; ellipse(cx,feet+1.5,size*0.56,2.3);
  const shape=pal.shape||'spiky';

  if(shape==='beetle'){
    const Wb=size*0.72, Hb=size*0.96, top=feet-Hb-bob;
    ctx.lineCap='round';
    ctx.strokeStyle=pal.spike; ctx.lineWidth=1.3;
    for(const s of [-1,1]) for(let l=0;l<3;l++){ const ly=top+Hb*(0.42+l*0.17);
      ctx.beginPath(); ctx.moveTo(cx+s*Wb*0.32,ly); ctx.lineTo(cx+s*Wb*0.64,ly+2+l*0.4+(w*s>0?1:0)); ctx.stroke(); }
    const asw=w*1.0;
    ctx.strokeStyle=pal.spike; ctx.lineWidth=1.4;
    for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(cx+s*Wb*0.18,top+1.5);

function drawBoss(cx,feet,S,pal,o){

  const w=Math.sin(o.walk||0), bob=ko?0:Math.abs(w)*S*0.05;
  const lookX=(o.dirX||0)*S*0.08, lookY=(o.dirY||0)*S*0.05;

  for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(cx+s*Wb*0.28, top+S*0.18);
    ctx.quadraticCurveTo(cx+s*Wb*0.5, top-S*0.5, cx+s*Wb*0.12, top-S*0.78); ctx.stroke();
    ctx.fillStyle=pal.horn; ctx.beginPath(); ctx.arc(cx+s*Wb*0.12, top-S*0.78, S*0.1,0,7); ctx.fill(); }

function boardXform(){
  const vi=viewInfo();
  const W=canvas.width, H=canvas.height, dpr=vi.dpr||1;
  const bw=COLS*TILE, bh=ROWS*TILE;
  const hud=H*0.105, pad=8*dpr;
  // On-screen touch controls (mirrors the CSS in build.shell.html): the D-pad
  // sits bottom-left, the bomb button bottom-right, each sized off the smaller
  // viewport edge with a pixel cap. Reserve room so the board never hides them.
  const vmin=Math.min(vi.cssW,vi.cssH);
  const dpadCss=Math.min(0.38*vmin,300), bombCss=Math.min(0.30*vmin,230);
  let areaW, areaH, topY;
  if(vi.portrait){
    // Tall screen: keep the board above a reserved bottom control band.
    const band=(dpadCss+24)*dpr;
    areaW=Math.max(40, W-pad*2);
    areaH=Math.max(40, H-hud-band-pad);
    topY=hud+pad;
  } else {
    // Wide screen: keep the board between left/right control gutters. Centering
    // on W/2 and clearing the wider gutter on both sides guarantees no overlap.
    const leftInset=(dpadCss+12)*dpr+pad, rightInset=(bombCss+16)*dpr+pad;
    const halfMax=W/2-Math.max(leftInset,rightInset);
    areaW=Math.max(40, halfMax*2);
    areaH=Math.max(40, H-hud-pad-10*dpr);
    topY=hud;
  }
  let s=Math.min(areaW/bw, areaH/bh);
  const sMax=64*dpr/TILE;            // cap on-screen tile size to ~64 CSS px
  if(s>sMax) s=sMax;
  const ox=W/2-bw*s/2;
  const oy=topY+(areaH-bh*s)/2;
  ctx.setTransform(s,0,0,s,ox,oy);
  return {s,ox,oy,hud};
}

      ctx.save(); ctx.translate(bo.cx,bo.cy+8); ctx.rotate((1-k)*6.2); ctx.scale(k,k); ctx.translate(-bo.cx,-(bo.cy+8));
      drawBoss(bo.cx,bo.cy+8,22,bo.pal,{ko:true}); ctx.restore();
    }
  }
  for(const p of game.parts){
    ctx.save(); ctx.globalAlpha=Math.max(0,p.t/p.life); ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*0.5,0,7); ctx.fill(); ctx.restore();
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const pp of game.popups){
    ctx.save(); ctx.globalAlpha=Math.min(1,pp.t*2);
    ctx.font='bold 7px '+FONT_R;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillText(pp.txt,pp.x+0.7,pp.y+0.7);
    ctx.fillStyle=pp.col; ctx.fillText(pp.txt,pp.x,pp.y); ctx.restore();
  }
  drawHud();
  if(game.phase==='count'){
    dimScreen(0.25);
    const c=Math.ceil(game.countT);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold '+Math.round(H*0.18)+'px '+FONT_R;
    const txt=c>0?String(c):'スタート！';
    if(c<=0) ctx.font='bold '+Math.round(H*0.11)+'px '+FONT_R;
    ctx.fillStyle='rgba(60,30,0,0.5)'; ctx.fillText(txt,W/2+3,H*0.46+3);
    ctx.fillStyle='#ffd23a'; ctx.fillText(txt,W/2,H*0.46);
    if(game.bossMode){ ctx.font='bold '+Math.round(H*0.05)+'px '+FONT_R; ctx.fillStyle='#ff9ad2';
      ctx.fillText('ボスバトル！',W/2,H*0.62); }
  }
  if(game.paused){
    dimScreen(0.55);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold '+Math.round(H*0.08)+'px '+FONT_R;
    ctx.fillStyle='#ffd23a'; ctx.fillText('ポーズ',W/2,H*0.27);
    twoButtons(['つづける','タイトルへ'],game.pauseSel|0,H*0.52);
    ctx.font=Math.round(H*0.026)+'px '+FONT_R; ctx.fillStyle='#cfe0ff';
    ctx.fillText('\u2190 \u2192 でせんたく ・ ボムでけってい',W/2,H*0.7);
  }
  if(game.phase==='end'){
    dimScreen(0.4);
    if(game.bossMode){
      if(!(game.boss&&game.boss.alive)) drawClearCelebration();
      else { ribbonBanner(W/2,H*0.34,'まけちゃった…'); if(game.boss) drawFaceChip(W/2,H*0.52,H*0.06,game.boss.pal,false); }
    } else {
      const fwc=['#ffd34d','#ff7a3a','#7cc0ff','#ff9ad2','#7be06a'];
      for(let k=0;k<4;k++){
        const cyc=(animClock*0.55+k*0.27)%1;
        const fx=W*(0.16+0.68*(((k*0.37)+0.13)%1)), fy=H*(0.16+0.2*(((k*0.53)+0.2)%1));
        const rad=cyc*H*0.15, al=Math.max(0,1-cyc), col=fwc[k%fwc.length];
        ctx.save(); ctx.globalAlpha=al*0.85; ctx.strokeStyle=col; ctx.lineWidth=2;
        for(let i=0;i<10;i++){ const a=i/10*6.28; ctx.beginPath(); ctx.moveTo(fx+Math.cos(a)*rad*0.5,fy+Math.sin(a)*rad*0.5); ctx.lineTo(fx+Math.cos(a)*rad,fy+Math.sin(a)*rad); ctx.stroke(); }
        ctx.restore();
      }
      const w=game.winner;

      const txt= w===0?'ブランブルのかち！': w>0?((wp&&wp.name||'てき')+'のかち…'):'ひきわけ！';
      ribbonBanner(W/2,H*0.36,txt);

    }

    ctx.fillStyle='#fff'; ctx.fillText('せんせき かち'+game.save.w+'・まけ'+game.save.l,W/2,H*0.66);
    if(game.endT>0.9&&Math.floor(animClock*2)%2===0){

      ctx.fillText('ボム / タップ で もういちど ・ ポーズでタイトルへ',W/2,H*0.78);

}
function drawClearCelebration(){
  const W=canvas.width,H=canvas.height,t=animClock;
  const g=ctx.createRadialGradient(W/2,H*0.5,H*0.04,W/2,H*0.5,H*0.72);
  g.addColorStop(0,'rgba(255,232,150,0.28)'); g.addColorStop(1,'rgba(255,232,150,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // falling confetti (deterministic from index + animClock)
  const cols=['#ff5d6c','#ffd23a','#7be06a','#5aa6ff','#ff9ad2','#ffffff'];
  for(let i=0;i<48;i++){
    const sx=((i*73)%100)/100*W, speed=0.22+(i%5)*0.06;
    const yy=((t*speed+i*0.137)%1)*(H+40)-20, sway=Math.sin(t*2+i)*10, rot=t*3+i;
    ctx.save(); ctx.translate(sx+sway,yy); ctx.rotate(rot);
    ctx.fillStyle=cols[i%cols.length]; ctx.fillRect(-3,-5,6,10); ctx.restore();
  }
  // star ring + bouncing buddy
  const bx=W/2, cy=H*0.54, burst=0.5+0.5*Math.sin(t*4);
  ctx.save(); ctx.globalAlpha=0.55;
  for(let i=0;i<12;i++){ const a=i/12*6.28+t*0.5, rad=H*0.11+burst*H*0.025;
    bStar(bx+Math.cos(a)*rad, cy+Math.sin(a)*rad, H*0.013,'#ffe9a0','#f0a020'); }
  ctx.restore();
  const bounce=Math.abs(Math.sin(t*3))*H*0.03;
  drawBuddy(bx, cy+H*0.02-bounce, H*0.085, CHARS[0], {dirX:0, walk:t*6, blink:false});
  ribbonBanner(W/2,H*0.26,'クリア！',H*0.12);
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='bold '+Math.round(H*0.04)+'px '+FONT_R;
  ctx.fillStyle='rgba(90,30,60,0.5)'; ctx.fillText('クチキングを たおした！',W/2+2,H*0.40+2);
  ctx.fillStyle='#fff'; ctx.fillText('クチキングを たおした！',W/2,H*0.40);
}
function drawSelIcon(type,cx,cy,s){
  if(type==='heart'){
    ctx.fillStyle='#ff5d6c'; ctx.beginPath();
    ctx.moveTo(cx,cy+s*0.5); ctx.bezierCurveTo(cx-s*0.7,cy-s*0.25,cx-s*0.2,cy-s*0.72,cx,cy-s*0.18);
    ctx.bezierCurveTo(cx+s*0.2,cy-s*0.72,cx+s*0.7,cy-s*0.25,cx,cy+s*0.5); ctx.fill();
  } else if(type==='speed'){
    ctx.fillStyle='#ffd23a'; ctx.strokeStyle='#e8a01e'; ctx.lineWidth=s*0.1;
    ctx.beginPath(); ctx.moveTo(cx+s*0.3,cy-s*0.6); ctx.lineTo(cx-s*0.35,cy+s*0.12); ctx.lineTo(cx-s*0.02,cy+s*0.12); ctx.lineTo(cx-s*0.25,cy+s*0.6); ctx.lineTo(cx+s*0.4,cy-s*0.1); ctx.lineTo(cx+s*0.05,cy-s*0.1); ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if(type==='bomb'){
    ctx.fillStyle='#2a3550'; ctx.beginPath(); ctx.arc(cx,cy+s*0.12,s*0.44,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.5)'; ellipse(cx-s*0.15,cy-s*0.02,s*0.13,s*0.09);
    ctx.strokeStyle='#caa46a'; ctx.lineWidth=s*0.12; ctx.beginPath(); ctx.moveTo(cx,cy-s*0.3); ctx.quadraticCurveTo(cx+s*0.26,cy-s*0.58,cx+s*0.44,cy-s*0.42); ctx.stroke();
    bStar(cx+s*0.48,cy-s*0.44,s*0.2,'#ffd23a','#ef7a1e');
  } else if(type==='fire'){
    ctx.fillStyle='#ff7a1a'; ctx.beginPath(); ctx.moveTo(cx,cy-s*0.62); ctx.quadraticCurveTo(cx+s*0.55,cy-s*0.05,cx+s*0.28,cy+s*0.46); ctx.quadraticCurveTo(cx,cy+s*0.62,cx-s*0.28,cy+s*0.46); ctx.quadraticCurveTo(cx-s*0.55,cy-s*0.05,cx,cy-s*0.62); ctx.fill();
    ctx.fillStyle='#ffe04d'; ctx.beginPath(); ctx.moveTo(cx,cy-s*0.16); ctx.quadraticCurveTo(cx+s*0.22,cy+s*0.14,cx,cy+s*0.42); ctx.quadraticCurveTo(cx-s*0.22,cy+s*0.14,cx,cy-s*0.16); ctx.fill();
  }
}
function renderSelect(sel){
  const W=canvas.width,H=canvas.height,t=animClock;
  drawBackdrop(THEMES[0]);
  ctx.save(); ctx.globalAlpha=0.16; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.restore();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(H*0.07)+'px '+FONT_R;
  ctx.fillStyle='rgba(40,30,10,0.4)'; ctx.fillText('キャラを えらんでね！',W/2+2,H*0.115+2);
  ctx.fillStyle='#fff'; ctx.fillText('キャラを えらんでね！',W/2,H*0.115);
  const n=CHARS.length, gap=W*0.02, cw=W*0.2, ch=H*0.5, totalW=n*cw+(n-1)*gap, x0=(W-totalW)/2, yTop=H*0.24;
  game.selRects=[];
  for(let i=0;i<n;i++){
    const pal=CHARS[i], x=x0+i*(cw+gap), y=yTop, on=i===sel;
    game.selRects.push({x,y,w:cw,h:ch});
    if(on){ const gl=8+Math.abs(Math.sin(t*4))*4; ctx.save(); ctx.globalAlpha=0.6; ctx.fillStyle=pal.ring; rr(ctx,x-gl,y-gl,cw+gl*2,ch+gl*2,20); ctx.fill(); ctx.restore(); }
    ctx.fillStyle= on?'#ffffff':'rgba(255,255,255,0.6)'; rr(ctx,x,y,cw,ch,14); ctx.fill();
    ctx.strokeStyle=pal.ring; ctx.lineWidth=on?6:2.5; rr(ctx,x,y,cw,ch,14); ctx.stroke();
    if(on){ const py2=y-16-Math.abs(Math.sin(t*4))*9;
      ctx.fillStyle=pal.ring; ctx.beginPath(); ctx.moveTo(x+cw/2-15,py2-16); ctx.lineTo(x+cw/2+15,py2-16); ctx.lineTo(x+cw/2,py2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke(); }
    const bounce= on?Math.abs(Math.sin(t*3))*ch*0.05:0;
    drawBuddy(x+cw/2, y+ch*0.56-bounce, ch*0.36, pal, {dirX:0, walk: on?t*6:0, blink:false});
    ctx.font='bold '+Math.round(ch*0.11)+'px '+FONT_R; ctx.fillStyle=pal.shade; ctx.textAlign='center';
    ctx.fillText(pal.name, x+cw/2, y+ch*0.74);
    const pillW=cw*0.88, pillH=ch*0.15, px=x+cw/2-pillW/2, py=y+ch*0.81;
    ctx.fillStyle=pal.ring; rr(ctx,px,py,pillW,pillH,pillH*0.5); ctx.fill();
    drawSelIcon(pal.power, px+pillH*0.62, py+pillH*0.5, pillH*0.5);
    ctx.font='bold '+Math.round(ch*0.07)+'px '+FONT_R; ctx.fillStyle='#3a2a10'; ctx.textAlign='left';
    ctx.fillText(pal.tag, px+pillH*1.1, py+pillH*0.5);
    ctx.textAlign='center';
  }
  const psel=CHARS[sel];
  ctx.font='bold '+Math.round(H*0.045)+'px '+FONT_R;
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillText(psel.tip, W/2+2, H*0.845+2);
  ctx.fillStyle='#fff'; ctx.fillText(psel.tip, W/2, H*0.845);
  if(Math.floor(t*2)%2===0){
    ctx.font=Math.round(H*0.034)+'px '+FONT_R; ctx.fillStyle='#ffe9b0';
    ctx.fillText('タップ／ボムボタンで けってい！  ◀▶ で えらぶ', W/2, H*0.93);
  }
}
function renderTitle(row){
  const W=canvas.width,H=canvas.height,th=THEMES[0];
  drawBackdrop(th);
  ctx.fillStyle='#6cc756'; ctx.fillRect(0,H*0.8,W,H*0.2);

  ctx.fillStyle='rgba(90,40,0,0.45)'; ctx.fillText('BRAMBLE BOOM!',W/2+4,H*0.17+4);
  const lg=ctx.createLinearGradient(0,H*0.1,0,H*0.24); lg.addColorStop(0,'#ffd24d'); lg.addColorStop(1,'#ef7a1e');
  ctx.fillStyle=lg; ctx.fillText('BRAMBLE BOOM!',W/2,H*0.17);
  ctx.strokeStyle='#8a3a16'; ctx.lineWidth=Math.max(1.5,H*0.004); ctx.strokeText('BRAMBLE BOOM!',W/2,H*0.17);

  drawBuddy(W*0.16,H*0.84,H*0.085,CHARS[0],{dirX:1,walk:animClock*4,blink:(animClock%3>2.85)});
  drawBuddy(W*0.86,H*0.84,H*0.07,CHARS[1],{dirX:-1,walk:animClock*4+2});
  drawBombAt(W*0.27,H*0.815,1.5,animClock);
  const rows=[
    ['なんいど',DIFFICULTY[game.save.difficulty].name],
    ['あいて','CPU '+game.save.cpuCount+'人'],
    ['ステージ',game.save.themeSel===5?'ランダム':THEMES[game.save.themeSel].name],

    ['ボスバトル！',''],
  ];
  const y0=H*0.385, dy=H*0.09;
  for(let i=0;i<rows.length;i++){
    const y=y0+i*dy, on=i===row, isAction=i>=3, isBoss=i===4;
    ctx.font='bold '+Math.round(H*(isAction?0.05:0.04))+'px '+FONT_R;
    const label=isAction?rows[i][0]:rows[i][0]+'：'+rows[i][1];
    const tw=ctx.measureText(label).width;
    if(on){
      ctx.fillStyle=isBoss?'rgba(255,122,170,0.95)':'rgba(255,210,58,0.92)';
      rr(ctx,W/2-tw/2-H*0.05,y-dy*0.42,tw+H*0.1,dy*0.84,dy*0.3); ctx.fill();
      ctx.strokeStyle=isBoss?'#a81f5a':'#b9780c'; ctx.lineWidth=2; rr(ctx,W/2-tw/2-H*0.05,y-dy*0.42,tw+H*0.1,dy*0.84,dy*0.3); ctx.stroke();
      if(!isAction){
        ctx.fillStyle='#7a3a06';
        ctx.fillText('\u25c0',W/2-tw/2-H*0.085,y); ctx.fillText('\u25b6',W/2+tw/2+H*0.085,y);
      }
    }
    ctx.fillStyle=on?(isBoss?'#5a0626':'#5a3206'):'#fff';
    if(!on){ ctx.fillStyle='rgba(20,40,70,0.55)'; ctx.fillText(label,W/2+1.5,y+1.5); ctx.fillStyle= isBoss?'#ffd0e6':'#fff'; }
    ctx.fillText(label,W/2,y);
  }
  if(Math.floor(animClock*2)%2===0){
    ctx.font=Math.round(H*0.028)+'px '+FONT_R; ctx.fillStyle='rgba(20,40,70,0.6)';
    ctx.fillText('\u2191\u2193えらぶ ・ \u2190\u2192かえる ・ ボム/タップでスタート',W/2,H*0.93);
  }
  ctx.font=Math.round(H*0.022)+'px '+FONT_R; ctx.textAlign='right'; ctx.fillStyle='rgba(20,40,70,0.45)';
  ctx.fillText('せんせき かち'+game.save.w+'・まけ'+game.save.l,W*0.98,H*0.05);
  drawRotateHint();
}


// ===== src/scenes/TitleScene.js =====

class TitleScene{
  enter(){ this.row=3; setMusicTrack('map'); }
  update(){
    inputBegin();
    if(edge.up){ this.row=(this.row+4)%5; sfxJump(); }
    else if(edge.down){ this.row=(this.row+1)%5; sfxJump(); }
    else if(edge.left||edge.right){
      const d=edge.right?1:-1;
      if(this.row===0){ game.save.difficulty=(game.save.difficulty+d+3)%3; game.diff=DIFFICULTY[game.save.difficulty]; sfxJump(); }
      else if(this.row===1){ game.save.cpuCount=((game.save.cpuCount-1+d+3)%3)+1; sfxJump(); }
      else if(this.row===2){ game.save.themeSel=(game.save.themeSel+d+6)%6; sfxJump(); }
    }
    else if(edge.bomb||edge.start||game.oneShotStart){
      game.oneShotStart=false; sfxCoin(); persistSave();
      game.pendingBoss=(this.row===4); game.state='select';
    }
    inputEnd();
  }
  render(){ renderTitle(this.row); }
}


// ===== src/scenes/SelectScene.js =====

class SelectScene{
  enter(){ this.sel=Math.max(0,Math.min(CHARS.length-1,game.save.charSel|0)); }
  update(){
    inputBegin();
    if(edge.left){ this.sel=(this.sel+CHARS.length-1)%CHARS.length; sfxJump(); }
    else if(edge.right){ this.sel=(this.sel+1)%CHARS.length; sfxJump(); }
    else if(edge.pause){ game.state='title'; }                 // back to title (keyboard)
    else if(edge.bomb||edge.start){ this._confirm(this.sel); }
    else if(game.oneShotStart){
      game.oneShotStart=false;
      const hit=this._hitTest();
      this._confirm(hit==null?this.sel:hit);
    }
    inputEnd();
  }
  _hitTest(){
    const r=game.selRects; if(!r) return null;
    const x=game.tapX, y=game.tapY;
    for(let i=0;i<r.length;i++){ const c=r[i]; if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h) return i; }
    return null;
  }
  _confirm(i){
    this.sel=i; game.save.charSel=i; persistSave(); sfxCoin();
    startMatch({boss:!!game.pendingBoss});
  }
  render(){ renderSelect(this.sel); }
}


// ===== src/scenes/BattleScene.js =====

class BattleScene{
  enter(){}
  update(dt){
    inputBegin();
    if(game.paused) pausedMenu();
    else updateBattle(dt);
    inputEnd();
  }
  render(){ renderBattle(); }
}


// ===== src/scenes/SceneManager.js =====

class SceneManager{
  constructor(){ this.map={ title:new TitleScene(), select:new SelectScene(), battle:new BattleScene() }; this.cur=null; this.name=''; }
  set(name){ this.name=name; this.cur=this.map[name]; if(this.cur&&this.cur.enter) this.cur.enter(); }
  sync(){ const want = this.map[game.state]?game.state:'battle'; if(want!==this.name) this.set(want); }
  update(dt){ this.sync(); if(this.cur) this.cur.update(dt); }
  render(){ this.sync(); if(this.cur) this.cur.render(); }
}
const scenes=new SceneManager();


// ===== src/engine/loop.js =====
let animClock=0, lastT=0, accT=0;
function loopFrame(now){
  if(!lastT) lastT=now;
  let d=(now-lastT)/1000; lastT=now; if(d>0.1) d=0.1; accT+=d;
  while(accT>=STEP){ scenes.update(STEP); animClock+=STEP; accT-=STEP; }
  resize(); scenes.render();
  requestAnimationFrame(loopFrame);
}
function startLoop(){ requestAnimationFrame(loopFrame); }


// ===== src/main.js =====

canvas.addEventListener('pointerdown', (e)=>{
  initAudioOnce();
  const r=canvas.getBoundingClientRect && canvas.getBoundingClientRect();
  if(r && r.width){ const dpr=canvas.width/r.width; game.tapX=(e.clientX-r.left)*dpr; game.tapY=(e.clientY-r.top)*dpr; }
  if(game.state==='title'||game.state==='select'||(game.state==='battle'&&game.phase==='end')) game.oneShotStart=true;
});
const muteBtnEl=document.getElementById('muteBtn');
if(muteBtnEl) muteBtnEl.addEventListener('click', ()=>{ initAudioOnce(); toggleMute(); });
const pauseBtnEl=document.getElementById('pauseBtn');
if(pauseBtnEl) pauseBtnEl.addEventListener('click', ()=>{
  initAudioOnce();
  if(game.state!=='battle') return;
  if(game.paused){ game.paused=false; duckMusic(1); sfxPause(); }
  else if(game.phase==='play'){ game.paused=true; game.pauseSel=0; duckMusic(0); sfxPause(); }
});
const fsBtnEl=document.getElementById('fsBtn');
if(fsBtnEl) fsBtnEl.addEventListener('click', ()=>{
  initAudioOnce();
  if(document.fullscreenElement){ if(document.exitFullscreen) document.exitFullscreen(); }
  else if(stage&&stage.requestFullscreen) stage.requestFullscreen();
  else if(stage&&stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
});
if(typeof window!=='undefined'&&window.addEventListener) window.addEventListener('resize', resize);

const detBtnEl=document.getElementById('btn-detonate');
if(detBtnEl&&typeof setInterval!=='undefined'){
  const _iv=setInterval(()=>{
    const p=game.fighters&&game.fighters[0];
    detBtnEl.style.display=(game.state==='battle'&&p&&p.alive&&p.remote)?'flex':'none';
  }, 150);
  if(_iv&&_iv.unref) _iv.unref();   // don't keep a headless process alive
}

loadSave();
scenes.set('title');
resize();
startLoop();


})();
